<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Columbus Marathon Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171a;
    --surface:#1b1f23;
    --surface-2:#20252b;
    --line:#2b3036;
    --ink:#ece9e1;
    --ink-dim:#8f96a0;
    --easy:#6fa96b;
    --pace:#e0954a;
    --rest:#8d89b8;
    --race:#e0524c;
    --accent:#f2c14e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px 20px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;}

  /* Header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:6px;
  }
  h1{font-size:26px;font-weight:800;letter-spacing:-.01em;}
  .sub{color:var(--ink-dim);font-size:13.5px;margin-top:4px;}

  /* Countdown block */
  .countdown{
    display:flex;align-items:baseline;gap:10px;margin-top:18px;
  }
  .countdown .num{font-size:52px;font-weight:700;color:var(--accent);line-height:1;}
  .countdown .label{color:var(--ink-dim);font-size:13px;line-height:1.3;}

  /* Progress track (signature element) */
  .track{margin-top:22px;position:relative;height:34px;}
  .track-line{
    position:absolute;top:16px;left:0;right:0;height:2px;background:var(--line);
  }
  .track-fill{
    position:absolute;top:16px;left:0;height:2px;background:var(--accent);
    transition:width .4s ease;
  }
  .tick{
    position:absolute;top:12px;width:1px;height:10px;background:var(--line);
  }
  .tick.race{background:var(--race);height:14px;top:10px;}
  .marker{
    position:absolute;top:6px;width:14px;height:14px;border-radius:50%;
    background:var(--accent);border:3px solid var(--bg);
    transform:translateX(-50%);
    box-shadow:0 0 0 1px var(--accent);
  }
  .track-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--ink-dim);}

  /* Section titles */
  .section-title{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-dim);font-weight:700;margin:32px 0 12px;
  }

  /* Today / Tomorrow cards */
  .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.hero-grid{grid-template-columns:1fr;}}
  .day-card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:18px 18px 16px;border-left:4px solid var(--line);position:relative;
    min-height:128px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .day-card.easy{border-left-color:var(--easy);}
  .day-card.pace{border-left-color:var(--pace);}
  .day-card.rest{border-left-color:var(--rest);}
  .day-card.race{border-left-color:var(--race);}
  .day-card .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:700;}
  .day-card .date{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .day-card .miles{font-size:34px;font-weight:700;margin-top:14px;line-height:1;}
  .day-card .miles .unit{font-size:14px;color:var(--ink-dim);font-weight:500;margin-left:4px;}
  .day-card .type-label{font-size:13.5px;color:var(--ink);margin-top:4px;font-weight:600;}
  .pill{
    display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
    padding:3px 8px;border-radius:20px;margin-top:8px;text-transform:uppercase;
  }
  .pill.easy{background:rgba(111,169,107,.15);color:var(--easy);}
  .pill.pace{background:rgba(224,149,74,.15);color:var(--pace);}
  .pill.rest{background:rgba(141,137,184,.15);color:var(--rest);}
  .pill.race{background:rgba(224,82,76,.18);color:var(--race);}

  /* Weekly summary */
  .week-card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;
  }
  .week-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .week-total{font-size:38px;font-weight:700;line-height:1;}
  .week-total .unit{font-size:14px;color:var(--ink-dim);font-weight:500;}
  .week-range{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}
  .change-badge{
    font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;
  }
  .change-badge.up{background:rgba(224,149,74,.15);color:var(--pace);}
  .change-badge.down{background:rgba(111,169,107,.15);color:var(--easy);}
  .change-badge.flat{background:rgba(143,150,160,.15);color:var(--ink-dim);}

  .day-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day-cell{
    background:var(--surface-2);border-radius:8px;padding:9px 4px;text-align:center;
    border:1px solid transparent;
  }
  .day-cell.today{border-color:var(--accent);}
  .day-cell .dow{font-size:10px;color:var(--ink-dim);font-weight:700;letter-spacing:.05em;}
  .day-cell .mi{font-size:15px;font-weight:700;margin-top:5px;}
  .day-cell .dot{width:5px;height:5px;border-radius:50%;margin:5px auto 0;}
  .dot.easy{background:var(--easy);}
  .dot.pace{background:var(--pace);}
  .dot.rest{background:var(--rest);}
  .dot.race{background:var(--race);}

  /* Full plan table */
  .plan-toggle{
    width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
    color:var(--ink-dim);font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:12px 16px;border-radius:10px;cursor:pointer;margin-top:32px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .plan-toggle:hover{color:var(--ink);}
  .plan-table{display:none;margin-top:10px;overflow-x:auto;}
  .plan-table.open{display:block;}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:640px;}
  th{
    text-align:center;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-dim);font-weight:700;padding:8px 4px;border-bottom:1px solid var(--line);
  }
  td{text-align:center;padding:8px 4px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:12px;}
  td.wk{font-family:'Manrope';font-weight:700;color:var(--ink-dim);}
  td.easy{color:var(--easy);}
  td.pace{color:var(--pace);}
  td.rest{color:var(--rest);font-family:'Manrope';font-size:10.5px;}
  td.race{color:var(--race);font-family:'Manrope';font-size:10px;font-weight:700;}
  tr.current-week td{background:rgba(242,193,78,.06);}

  footer{margin-top:36px;text-align:center;color:var(--ink-dim);font-size:11.5px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Training Log — Matt</div>
    <h1>Columbus Marathon</h1>
    <div class="sub">Goal: finish healthy, sub-4:00 · Oct 18, 2026</div>
    <div class="countdown">
      <div class="num mono" id="countdownNum">--</div>
      <div class="label" id="countdownLabel">days to race day</div>
    </div>
    <div class="track">
      <div class="track-line"></div>
      <div class="track-fill" id="trackFill"></div>
      <div id="ticks"></div>
      <div class="marker" id="marker"></div>
    </div>
    <div class="track-labels"><span>Aug 10 — Day 1</span><span>Oct 18 — Race day</span></div>
  </header>

  <div class="section-title">Today</div>
  <div class="hero-grid">
    <div class="day-card" id="todayCard"></div>
    <div class="day-card" id="tomorrowCard"></div>
  </div>

  <div class="section-title">This Week</div>
  <div class="week-card" id="weekCard"></div>

  <button class="plan-toggle" id="planToggle">
    <span>Full 10-Week Plan</span>
    <span id="planChevron">+</span>
  </button>
  <div class="plan-table" id="planTable"></div>

  <footer>Hal Higdon–style build · flat, fast course · low elevation risk</footer>
</div>

<script>
const weeks = [
  { start:'2026-08-10', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:4,type:'pace',label:'Marathon pace'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:13,type:'easy',label:'Long run'},
    {miles:0,type:'rest',label:'Rest'}
  ]},
  { start:'2026-08-17', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:4,type:'pace',label:'Marathon pace'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:15,type:'easy',label:'Long run'},
    {miles:0,type:'rest',label:'Rest'}
  ]},
  { start:'2026-08-24', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:6,type:'easy',label:'Easy run'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:18,type:'easy',label:'Long run'},
    {miles:0,type:'rest',label:'Rest'}
  ]},
  { start:'2026-08-31', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:5,type:'easy',label:'Easy run'},
    {miles:7,type:'pace',label:'Marathon pace'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:10,type:'easy',label:'Long run (cutback)'},
    {miles:0,type:'rest',label:'Rest'}
  ]},
  { start:'2026-09-07', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:5,type:'easy',label:'Easy run'},
    {miles:5,type:'pace',label:'Marathon pace'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:16,type:'easy',label:'Long run'},
    {miles:0,type:'rest',label:'Rest'}
  ]},
  { start:'2026-09-14', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:3,type:'easy',label:'Easy run'},
    {miles:8,type:'easy',label:'Mid-week long'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:3,type:'easy',label:'Shakeout'},
    {miles:13.1,type:'race',label:'Garmin Half Marathon',countInTotal:false}
  ]},
  { start:'2026-09-21', days:[
    {miles:0,type:'rest',label:'Rest'},
    {miles:5,type:'easy',label:'Easy run'},
    {miles:5,type:'pace',label:'Marathon pace'},
    {miles:3,type:'easy',label:'Easy run'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:15,type:'easy',label:'Long run'},
    {miles:0,type:'rest',label:'Rest'}
  ]},
  { start:'2026-09-28', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:5,type:'easy',label:'Easy run'},
    {miles:4,type:'pace',label:'Marathon pace'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:20,type:'easy',label:'Long run — peak'},
    {miles:0,type:'rest',label:'Rest'}
  ]},
  { start:'2026-10-05', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:4,type:'easy',label:'Easy run'},
    {miles:3,type:'easy',label:'Easy run'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:3,type:'easy',label:'Easy run'},
    {miles:8,type:'easy',label:'Long run (taper)'},
    {miles:0,type:'rest',label:'Rest'}
  ]},
  { start:'2026-10-12', days:[
    {miles:3,type:'easy',label:'Easy run'},
    {miles:2,type:'easy',label:'Easy run'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:2,type:'easy',label:'Shakeout'},
    {miles:0,type:'rest',label:'Rest'},
    {miles:26.2,type:'race',label:'Columbus Marathon 🏁',countInTotal:false}
  ]}
];

const DOW = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const MSDAY = 86400000;

// Flatten into a lookup by ISO date string
const flat = [];
weeks.forEach((wk,wi)=>{
  const start = new Date(wk.start+'T00:00:00');
  wk.days.forEach((d,di)=>{
    const date = new Date(start.getTime() + di*MSDAY);
    flat.push({...d, date, weekIndex:wi, dow:DOW[di]});
  });
});

const planStart = flat[0].date;
const raceDay = flat[flat.length-1].date;
const today = new Date(); today.setHours(0,0,0,0);

function fmtDate(d){
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function findDay(offset){
  const target = new Date(today.getTime() + offset*MSDAY);
  return flat.find(f => f.date.getTime() === target.getTime()) || null;
}

// ---- Countdown + track ----
const daysToRace = Math.round((raceDay - today)/MSDAY);
document.getElementById('countdownNum').textContent = daysToRace >= 0 ? daysToRace : 0;
document.getElementById('countdownLabel').textContent = daysToRace > 0
  ? 'days to race day'
  : (daysToRace === 0 ? "it's race day — go get it 🏁" : "race complete — nice work 🎉");

const totalSpan = (raceDay - planStart)/MSDAY;
let elapsed = (today - planStart)/MSDAY;
elapsed = Math.max(0, Math.min(totalSpan, elapsed));
const pct = (elapsed/totalSpan)*100;
document.getElementById('trackFill').style.width = pct+'%';
document.getElementById('marker').style.left = pct+'%';

const ticksEl = document.getElementById('ticks');
weeks.forEach((wk,i)=>{
  const t = document.createElement('div');
  t.className = 'tick';
  const wkOffset = (new Date(wk.start+'T00:00:00') - planStart)/MSDAY;
  t.style.left = (wkOffset/totalSpan*100)+'%';
  ticksEl.appendChild(t);
});
const raceTick = document.createElement('div');
raceTick.className = 'tick race';
raceTick.style.left = '100%';
ticksEl.appendChild(raceTick);

// ---- Today / Tomorrow cards ----
function renderDayCard(el, offset, tag){
  const info = findDay(offset);
  const target = new Date(today.getTime() + offset*MSDAY);

  if (!info){
    if (target < planStart){
      const untilStart = Math.round((planStart - target)/MSDAY);
      el.className = 'day-card rest';
      el.innerHTML = `
        <div>
          <div class="tag">${tag}</div>
          <div class="date">${fmtDate(target)}</div>
        </div>
        <div>
          <div class="type-label">Plan hasn't started yet</div>
          <div class="pill rest">${untilStart===0?'Starts today':'Starts in '+untilStart+' day'+(untilStart>1?'s':'')}</div>
        </div>`;
    } else {
      el.className = 'day-card race';
      el.innerHTML = `
        <div>
          <div class="tag">${tag}</div>
          <div class="date">${fmtDate(target)}</div>
        </div>
        <div>
          <div class="type-label">Plan complete</div>
          <div class="pill race">Recovery mode</div>
        </div>`;
    }
    return;
  }

  el.className = `day-card ${info.type}`;
  const milesHtml = info.type==='rest'
    ? `<div class="miles">—</div>`
    : `<div class="miles">${info.miles}<span class="unit">mi</span></div>`;

  el.innerHTML = `
    <div>
      <div class="tag">${tag}</div>
      <div class="date">${fmtDate(info.date)}</div>
    </div>
    <div>
      ${milesHtml}
      <div class="type-label">${info.label}</div>
      <span class="pill ${info.type}">${info.type}</span>
    </div>`;
}
renderDayCard(document.getElementById('todayCard'), 0, 'Today');
renderDayCard(document.getElementById('tomorrowCard'), 1, 'Tomorrow');

// ---- Weekly summary ----
function weekTotal(wk){
  return wk.days.reduce((s,d)=> s + (d.countInTotal===false ? 0 : d.miles), 0);
}
let currentWeekIdx;
if (today < planStart) currentWeekIdx = 0;
else if (today > raceDay) currentWeekIdx = weeks.length-1;
else currentWeekIdx = flat.find(f=>f.date.getTime()===today.getTime())?.weekIndex ?? 0;

const wk = weeks[currentWeekIdx];
const wkStart = new Date(wk.start+'T00:00:00');
const wkEnd = new Date(wkStart.getTime()+6*MSDAY);
const total = weekTotal(wk);
const prevTotal = currentWeekIdx>0 ? weekTotal(weeks[currentWeekIdx-1]) : null;
let changeHtml = '';
if (prevTotal !== null){
  const pctChange = Math.round(((total-prevTotal)/prevTotal)*100);
  const cls = pctChange>0?'up':(pctChange<0?'down':'flat');
  const arrow = pctChange>0?'↑':(pctChange<0?'↓':'→');
  changeHtml = `<span class="change-badge ${cls}">${arrow} ${Math.abs(pctChange)}% vs last wk</span>`;
}

const dayRowHtml = wk.days.map((d,di)=>{
  const date = new Date(wkStart.getTime()+di*MSDAY);
  const isToday = date.getTime()===today.getTime();
  const miDisplay = d.type==='rest' ? '–' : (Number.isInteger(d.miles)?d.miles:d.miles.toFixed(1));
  return `<div class="day-cell ${isToday?'today':''}">
      <div class="dow">${DOW[di]}</div>
      <div class="mi mono">${miDisplay}</div>
      <div class="dot ${d.type}"></div>
    </div>`;
}).join('');

document.getElementById('weekCard').innerHTML = `
  <div class="week-head">
    <div>
      <div class="week-total mono">${total}<span class="unit">mi planned</span></div>
      <div class="week-range">Week ${currentWeekIdx+1} of 10 · ${fmtDate(wkStart)} – ${fmtDate(wkEnd)}</div>
    </div>
    ${changeHtml}
  </div>
  <div class="day-row">${dayRowHtml}</div>
`;

// ---- Full plan table ----
const typeLabel = {easy:'', pace:'pace', rest:'rest', race:''};
let rows = '';
weeks.forEach((w,i)=>{
  const wStart = new Date(w.start+'T00:00:00');
  const wEnd = new Date(wStart.getTime()+6*MSDAY);
  const tot = weekTotal(w);
  const cells = w.days.map(d=>{
    if (d.type==='rest') return `<td class="rest">rest</td>`;
    if (d.type==='race') return `<td class="race">${d.miles}mi</td>`;
    const cls = d.type==='pace' ? 'pace' : 'easy';
    return `<td class="${cls}">${Number.isInteger(d.miles)?d.miles:d.miles}</td>`;
  }).join('');
  rows += `<tr class="${i===currentWeekIdx?'current-week':''}">
    <td class="wk">Wk ${i+1}</td>${cells}<td class="wk">${tot}mi</td>
  </tr>`;
});

document.getElementById('planTable').innerHTML = `
  <table>
    <thead><tr><th></th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th><th>Total</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

document.getElementById('planToggle').addEventListener('click', ()=>{
  const t = document.getElementById('planTable');
  const chev = document.getElementById('planChevron');
  t.classList.toggle('open');
  chev.textContent = t.classList.contains('open') ? '–' : '+';
});
</script>
</body>
</html>
