<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NYC 26.2 — Marathon Training</title>
<meta name="theme-color" content="#1B2A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --ink: #1B2A2E;
  --ink-soft: #2A3E43;
  --parchment: #F1ECD9;
  --parchment-dim: #E7E0C9;
  --orange: #E4572E;
  --teal: #3E8E82;
  --grey: #6B6355;
  --amber: #E8A33D;
  --line: rgba(27,42,46,0.12);
  --line-on-ink: rgba(241,236,217,0.16);

  --font-display: 'Oswald', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--parchment);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding-bottom:76px; /* room for bottom tab bar */
}

h1,h2,h3{ font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.02em; margin:0; }

/* =========================================================
   HEADER
   ========================================================= */
.app-header{
  background:var(--ink);
  color:var(--parchment);
  padding:18px 18px 0 18px;
  position:sticky;
  top:0;
  z-index:20;
}
.header-inner{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
}
.app-title{
  font-family:var(--font-display);
  font-size:22px;
  letter-spacing:0.06em;
  color:var(--parchment);
}
.app-title span{ color:var(--orange); }
.race-countdown{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--amber);
}
.elevation-strip{
  display:block;
  width:100%;
  height:34px;
  margin-top:10px;
}

/* =========================================================
   TAB BAR (bottom, mobile-app style)
   ========================================================= */
.tab-bar{
  position:fixed;
  bottom:0; left:0; right:0;
  display:flex;
  background:var(--ink);
  border-top:1px solid var(--line-on-ink);
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom, 0);
}
.tab-btn{
  flex:1;
  background:none;
  border:none;
  color:rgba(241,236,217,0.55);
  font-family:var(--font-display);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  padding:13px 4px 11px 4px;
  cursor:pointer;
  border-top:2px solid transparent;
}
.tab-btn.active{
  color:var(--parchment);
  border-top-color:var(--orange);
}

/* =========================================================
   LAYOUT / SECTIONS
   ========================================================= */
main{ max-width:640px; margin:0 auto; padding:0 14px; }
.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

.section-head{ padding:20px 4px 10px 4px; }
.section-head h2{ font-size:24px; color:var(--ink); }
.section-head .sub{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--grey);
  margin:4px 0 0 0;
}

.card{
  background:#FBF9F0;
  border:1px solid var(--line);
  border-radius:6px;
  padding:16px;
  margin-bottom:14px;
}
.card-eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--grey);
  margin-bottom:8px;
}
.muted{ color:var(--grey); }

.intro-card p{ margin:0; line-height:1.55; font-size:14.5px; }

/* =========================================================
   PLAN TAB — WEEK CARDS
   ========================================================= */
.week-list{ display:flex; flex-direction:column; gap:14px; padding-bottom:20px; }

.week-card{
  background:#FBF9F0;
  border:1px solid var(--line);
  border-radius:6px;
  padding:14px;
}
.week-card-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.week-num{
  font-family:var(--font-display);
  font-size:17px;
  color:var(--ink);
  background:var(--parchment-dim);
  border-radius:4px;
  padding:2px 8px;
}
.week-dates{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--grey);
  flex:1;
}
.week-phase{
  font-family:var(--font-mono);
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  padding:3px 8px;
  border-radius:20px;
  color:#fff;
}
.phase-base{ background:var(--teal); }
.phase-build{ background:var(--ink); }
.phase-peak{ background:var(--orange); }
.phase-race-prep{ background:var(--amber); color:var(--ink); }
.phase-cutback{ background:var(--grey); }
.phase-taper{ background:#8B7E6A; }
.phase-race-week{ background:var(--orange); }

.day-row{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.day-cell{
  border-left:3px solid var(--line);
  padding:4px 4px 4px 6px;
  min-height:78px;
}
.day-cell.type-easy{ border-left-color:var(--teal); }
.day-cell.type-pace{ border-left-color:var(--amber); }
.day-cell.type-long{ border-left-color:var(--orange); }
.day-cell.type-rest{ border-left-color:var(--line); }
.day-cell.type-cross{ border-left-color:#B7AF98; }
.day-cell.type-shakeout{ border-left-color:var(--teal); }
.day-cell.type-race{ border-left-color:var(--orange); background:rgba(228,87,46,0.08); }

.day-abbr{
  font-family:var(--font-mono);
  font-size:9.5px;
  color:var(--grey);
  letter-spacing:0.04em;
}
.day-mi{
  font-family:var(--font-display);
  font-size:17px;
  line-height:1.3;
  color:var(--ink);
}
.day-label{
  font-size:9.5px;
  line-height:1.25;
  color:var(--ink-soft);
  margin-top:1px;
}
.hill-tag{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:8px;
  color:var(--orange);
  border:1px solid var(--orange);
  border-radius:3px;
  padding:0 3px;
  margin-top:2px;
}

.week-total{
  margin-top:10px;
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--grey);
  border-top:1px dashed var(--line);
  padding-top:8px;
}
.week-total strong{ color:var(--ink); font-size:14px; }

/* =========================================================
   TODAY TAB
   ========================================================= */
.today-run{
  background:var(--ink);
  color:var(--parchment);
  border:none;
}
.today-run .card-eyebrow{ color:rgba(241,236,217,0.6); }
.today-run-main{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin-top:4px;
}
.today-mi{
  font-family:var(--font-display);
  font-size:52px;
  line-height:1;
  color:var(--amber);
}
.today-run-label{
  font-size:16px;
  color:var(--parchment);
}
.hill-callout{
  margin-top:12px;
  padding:10px 12px;
  background:rgba(228,87,46,0.18);
  border-left:3px solid var(--orange);
  border-radius:4px;
  font-size:13px;
  line-height:1.5;
}

.weather-main{ display:flex; align-items:baseline; gap:10px; }
.weather-temp{ font-family:var(--font-display); font-size:34px; }
.weather-desc{ font-size:14px; color:var(--ink-soft); }
.weather-details{
  display:flex; gap:16px;
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--grey);
  margin-top:6px;
}
.weather-loc{
  margin-top:10px;
  font-size:11.5px;
  color:var(--grey);
}
.link-btn{
  background:none; border:none; padding:0;
  color:var(--teal); text-decoration:underline;
  font-size:11.5px; cursor:pointer; font-family:var(--font-body);
}

.today-lift-name{ font-family:var(--font-display); font-size:19px; margin-top:2px; }
.today-lift-meta{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--grey);
  margin-top:2px;
}
.week-note{ font-size:13.5px; line-height:1.5; color:var(--ink-soft); margin:10px 0 0 0; }
.btn-link{
  display:inline-block;
  margin-top:12px;
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--orange);
  text-decoration:none;
  cursor:pointer;
}
.today-lift.no-lift{ background:#FBF9F0; }

/* =========================================================
   STRENGTH TAB
   ========================================================= */
.lift-day-label{
  font-family:var(--font-mono);
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--grey);
  margin:14px 0 6px 0;
}
.session-block{
  border:1px solid var(--line);
  border-radius:6px;
  margin-bottom:8px;
  overflow:hidden;
}
.session-head{
  background:var(--parchment-dim);
  padding:8px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.session-name{ font-family:var(--font-display); font-size:13.5px; }
.session-dur{ font-family:var(--font-mono); font-size:11px; color:var(--grey); }

.exercise{
  border-top:1px solid var(--line);
  background:#FBF9F0;
}
.exercise summary{
  list-style:none;
  cursor:pointer;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.exercise summary::-webkit-details-marker{ display:none; }
.exercise summary::after{
  content:'+';
  font-family:var(--font-display);
  font-size:16px;
  color:var(--orange);
  margin-left:auto;
  flex-shrink:0;
}
.exercise[open] summary::after{ content:'\2212'; }
.ex-name{ font-size:13.5px; font-weight:600; }
.ex-sets{ font-family:var(--font-mono); font-size:11.5px; color:var(--grey); white-space:nowrap; }
.ex-body{ padding:0 12px 14px 12px; }
.ex-tag{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  color:var(--teal);
  border:1px solid var(--teal);
  border-radius:20px;
  padding:2px 8px;
  margin-bottom:8px;
}
.ex-body p{ font-size:13.5px; line-height:1.55; margin:6px 0; }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (min-width:600px){
  .day-cell{ min-height:88px; padding:6px 6px 6px 8px; }
  .day-label{ font-size:10.5px; }
  .today-mi{ font-size:60px; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="app-title">NYC <span>26.2</span></div>

  </div>
  <svg class="elevation-strip" viewBox="0 0 400 34" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,28 30,26 55,10 80,22 130,20 170,21 210,23 235,6 270,18 310,17 340,16 370,19 400,17"
      fill="none" stroke="#E4572E" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  </svg>
</header>

<main>
  <section id="tab-today" class="tab-panel active"></section>
  <section id="tab-plan" class="tab-panel"></section>
  <section id="tab-strength" class="tab-panel"></section>
</main>

<nav class="tab-bar">
  <button class="tab-btn active" data-tab="today">Today</button>
  <button class="tab-btn" data-tab="plan">Plan</button>
  <button class="tab-btn" data-tab="strength">Strength</button>
</nav>

<script>

  { n:3,  start:'2026-08-03', end:'2026-08-09', phase:'Base',

    total:30 },
  { n:4,  start:'2026-08-10', end:'2026-08-16', phase:'Build',
    days:{ mon:{t:'easy',mi:4,label:'4 mi easy'}, tue:{t:'easy',mi:8,label:'8 mi easy'}, wed:{t:'easy',mi:4,label:'4 mi easy'}, thu:{t:'rest',mi:0,label:'Rest'}, fri:{t:'pace',mi:8,label:'8 mi pace'}, sat:{t:'long',mi:16,label:'16 mi long run'}, sun:{t:'cross',mi:0,label:'Cross-training'} },
    total:40 },
  { n:5,  start:'2026-08-17', end:'2026-08-23', phase:'Build',
    days:{ mon:{t:'easy',mi:4,label:'4 mi easy'}, tue:{t:'easy',mi:8,label:'8 mi easy'}, wed:{t:'easy',mi:4,label:'4 mi easy'}, thu:{t:'rest',mi:0,label:'Rest'}, fri:{t:'easy',mi:8,label:'8 mi run'}, sat:{t:'long',mi:17,label:'17 mi long run'}, sun:{t:'cross',mi:0,label:'Cross-training'} },
    total:41 },
  { n:6,  start:'2026-08-24', end:'2026-08-30', phase:'Build',
    days:{ mon:{t:'easy',mi:4,label:'4 mi easy'}, tue:{t:'easy',mi:9,label:'9 mi easy',hill:true}, wed:{t:'easy',mi:4,label:'4 mi easy'}, thu:{t:'rest',mi:0,label:'Rest'}, fri:{t:'pace',mi:7,label:'7 mi pace'}, sat:{t:'long',mi:13,label:'13 mi long run'}, sun:{t:'cross',mi:0,label:'Cross-training'} },
    total:37 },
  { n:7,  start:'2026-08-31', end:'2026-09-06', phase:'Build',
    days:{ mon:{t:'easy',mi:4,label:'4 mi easy'}, tue:{t:'easy',mi:9,label:'9 mi easy'}, wed:{t:'easy',mi:4,label:'4 mi easy'}, thu:{t:'rest',mi:0,label:'Rest'}, fri:{t:'pace',mi:9,label:'9 mi pace'}, sat:{t:'long',mi:19,label:'19 mi long run'}, sun:{t:'cross',mi:0,label:'Cross-training'} },
    total:45 },
  { n:8,  start:'2026-09-07', end:'2026-09-13', phase:'Peak',
    days:{ mon:{t:'easy',mi:5,label:'5 mi easy'}, tue:{t:'easy',mi:10,label:'10 mi easy'}, wed:{t:'easy',mi:5,label:'5 mi easy'}, thu:{t:'rest',mi:0,label:'Rest'}, fri:{t:'easy',mi:10,label:'10 mi run'}, sat:{t:'long',mi:20,label:'20 mi long run'}, sun:{t:'cross',mi:0,label:'Cross-training'} },
    total:50 },
  { n:9,  start:'2026-09-14', end:'2026-09-20', phase:'Race Prep',

    total:32.1 },
  { n:10, start:'2026-09-21', end:'2026-09-27', phase:'Peak',
    days:{ mon:{t:'easy',mi:5,label:'5 mi easy'}, tue:{t:'easy',mi:10,label:'10 mi easy',hill:true}, wed:{t:'easy',mi:5,label:'5 mi easy'}, thu:{t:'rest',mi:0,label:'Rest'}, fri:{t:'pace',mi:10,label:'10 mi pace'}, sat:{t:'long',mi:20,label:'20 mi long run'}, sun:{t:'cross',mi:0,label:'Cross-training'} },
    total:50 },
  { n:11, start:'2026-09-28', end:'2026-10-04', phase:'Cutback',
    days:{ mon:{t:'easy',mi:5,label:'5 mi easy'}, tue:{t:'easy',mi:6,label:'6 mi easy'}, wed:{t:'easy',mi:5,label:'5 mi easy'}, thu:{t:'rest',mi:0,label:'Rest'}, fri:{t:'easy',mi:6,label:'6 mi run'}, sat:{t:'long',mi:12,label:'12 mi long run'}, sun:{t:'cross',mi:0,label:'Cross-training'} },

  { n:13, start:'2026-10-12', end:'2026-10-18', phase:'Taper',

    total:34 },
  { n:14, start:'2026-10-19', end:'2026-10-25', phase:'Taper',

    total:35.2 },

const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_NAMES = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};

/* =========================================================
   STRENGTH — EXERCISE LIBRARY
   ========================================================= */

const EXERCISES = {
  deadlift: { name:'Trap Bar Deadlift or Back Squat', sets:'3-4 x 4-6', tag:'Heavy compound',
    why:"This is the primary heavy stimulus. Twice-weekly heavy-load lifting is what the research (Millet et al. 2002, Li et al. 2021) ties to real running economy gains — roughly 6-7% improvement in studies. It builds the raw force production your stride depends on late in the race.",
    how:"Full stance width, brace your core before you unrack, drive through the whole foot, and control the lowering phase instead of dropping into it. Pick a load where reps 5-6 are genuinely hard but your form doesn't break down — 2-3 reps left in the tank." },
  stepdown: { name:'Eccentric Step-Down', sets:'3 x 8/side', tag:'Downhill prep',
    why:"This is the single most important exercise for the quad soreness you had at Flying Pig. NYC's descents off the Verrazzano, Queensboro, and Fifth Avenue into Central Park all demand your quads act as brakes. This exercise trains exactly that braking (eccentric) contraction.",
    how:"Stand on a 6-8\" box or step. Slowly lower your free leg to lightly tap the floor over a 3-4 count, keeping your standing knee tracking over your toes. Step back up with control. Slow and controlled beats heavy here." },
  slrdl: { name:'Single-Leg Romanian Deadlift', sets:'3 x 8/side', tag:'Hamstring + balance',
    why:"Hamstring strength and balance that holds your running form together in the final miles, when fatigue makes everything want to collapse.",
    how:"Hinge at the hips with a soft bend in the standing knee, letting your free leg reach back as your torso lowers toward parallel. Keep your hips square. Return to standing under control." },
  hipthrust: { name:'Hip Thrust', sets:'3 x 8', tag:'Glute power',
    why:"Glute strength drives stride length and power, and protects against the late-race form collapse — the moment your hips stop firing and your stride shortens and slows.",
    how:"Upper back braced on a bench, feet flat, drive your hips up through your heels until fully extended and squeeze your glutes at the top. Lower with control, don't let your hips drop fast." },
  calfraise: { name:'Standing Calf Raise', sets:'3 x 10-12', tag:'Cramp prevention',
    why:"Calves are one of the most common cramping sites in a marathon. Building real strength capacity here — not just endurance — is directly protective.",
    how:"Slow 2-count up onto your toes, brief pause at the top, slow 3-count back down through a full range of motion. Add weight (dumbbells, a barbell, or a machine) as it gets easy." },
  plank: { name:'Side Plank or Copenhagen Plank', sets:'2 x 30-45s/side', tag:'Hip/core stability',
    why:"Keeps your hips and core from collapsing sideways when you're fatigued — this is what holds your stride mechanics together late in the race.",
    how:"Elbow stacked under your shoulder, body in a straight line from head to heels, hips lifted. For the Copenhagen variation, rest your top foot on a bench for a bigger hip-adductor load." },
  bulgarian: { name:'Bulgarian Split Squat (slow eccentric)', sets:'3 x 6-8/side', tag:'Single-leg + eccentric',
    why:"Single-leg strength that mirrors actual running mechanics — you run on one leg at a time — with the slow lowering adding the same eccentric quad loading as the Eccentric Step-Down.",
    how:"Rear foot elevated on a bench behind you, front foot far enough forward that your knee stays over your ankle. Lower over a 3-count until your front thigh is near parallel, then drive back up." },
  bandwalk: { name:'Lateral Band Walk / Side-Lying Hip Abduction', sets:'3 x 10-12/side', tag:'Hip stability — NYC bridges',
    why:"Strengthens glute medius, the muscle that controls sideways sway. This is aimed squarely at the hip soreness you had last time — it's what stabilizes your hip on cambered bridge decks and controls lateral drift on the downhills.",
    how:"Band around your ankles or just above your knees. Stay in a slight squat and step sideways while keeping tension on the band the entire time. Don't let your knees cave inward." },
  plyo: { name:'Low-Volume Plyometrics (pogo hops, low bounds)', sets:'2-3 x 15-20s', tag:'Running economy',
    why:"Builds tendon stiffness and neuromuscular efficiency — another lever for running economy. Kept short and low-volume so it adds a training stimulus without piling on extra fatigue.",
    how:"Quick, small ground contacts — think 'stiff spring,' not a big jump. Focus on minimizing time on the ground, not on jumping high." },
  slcalf: { name:'Single-Leg Calf Raise + Tibialis Raise', sets:'3 x 12-15/side', tag:'Calf + shin',
    why:"Single-leg calf strength for cramp prevention, plus shin (tibialis) strength to protect against shin splints as your weekly mileage climbs.",
    how:"Single-leg calf raise off a step, full range of motion. For the tibialis raise, prop your heels on a small block or plate and lift just your toes up toward your shins." },
  pallof: { name:'Pallof Press', sets:'3 x 10/side', tag:'Anti-rotation core',
    why:"Anti-rotation core strength that keeps your trunk steady in the final miles, when everything wants to twist and your form starts compensating.",
    how:"Band or cable anchored at chest height, standing perpendicular to the anchor. Press straight out in front of your chest and resist the pull trying to rotate your torso. Slow return." },
  slglute: { name:'Single-Leg Glute Bridge', sets:'3 x 10/side', tag:'Unilateral glute',
    why:"Unilateral glute work that's closer to the actual single-leg demand of running than a standard two-leg bridge.",
    how:"One foot on the ground, opposite leg extended or bent. Drive your hips up, squeeze at the top, lower with control." },
  goblet: { name:'Goblet Squat', sets:'3 x 10', tag:'General strength',
    why:"General lower-body strength base-building without excess fatigue — ideal filler on a lower-mileage week when you're not pushing max loads.",
    how:"Hold a dumbbell or kettlebell at your chest, squat to a comfortable depth while keeping your torso upright, drive back up through your whole foot." },
  hipmobility: { name:'90-90 Hip Mobility / Hip Circles', sets:'2 x 8-10/side', tag:'Mobility — don\'t skip',
    why:"Your Garmin data from your last training block flagged dropped strength and mobility work late in the block as tied directly to your cramping. This keeps hip mobility in every single week's rotation, not just when it's convenient.",
    how:"Sit in a 90-90 position (front shin and back shin both at 90 degrees) and rotate through both hips. Or standing hip circles, moving each hip through its full range in both directions." },
  deadbug: { name:'Dead Bug or Bird Dog', sets:'2 x 10/side', tag:'Low-fatigue core',
    why:"Core stability trained without adding real fatigue — a good fit on a lighter auxiliary day.",
    how:"Dead bug: on your back, low back flat on the floor, extend opposite arm and leg without letting your back arch. Bird dog: same idea on hands and knees, keeping your spine neutral." },
  couchstretch: { name:'Couch Stretch / Quad-Hip Flexor Stretch', sets:'2 x 45-60s/side', tag:'Quad/hip mobility',
    why:"Directly targets quad and hip flexor tightness — the exact area that was sore after your first marathon. Tight hip flexors also change your stride mechanics as fatigue sets in.",
    how:"Rear knee down with your rear foot up against a wall or couch, front foot forward in a lunge position. Gently drive your hips forward until you feel a stretch through the front of your hip and quad." },
};

const SESSIONS = {
  A: { name:'Session A — Heavy Lower + Posterior Chain', duration:'~40-45 min', exercises:['deadlift','stepdown','slrdl','hipthrust','calfraise','plank'] },
  B: { name:'Session B — Power, Stability & Durability', duration:'~35-40 min', exercises:['bulgarian','bandwalk','plyo','slcalf','pallof','slglute'] },
  C: { name:'Session C — Auxiliary & Mobility', duration:'~20-25 min', exercises:['goblet','hipmobility','deadbug','couchstretch'] },
};

/* Per-week lift schedule: which days get which session, plus a coaching note */
const LIFT_SCHEDULE = {
  1:  { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'},{day:'sun',s:'C'}], note:'Base phase — moderate loads, dial in form. 3 sessions while running volume is still low.' },
  2:  { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'},{day:'sun',s:'C'}], note:'Same as last week — moderate loads, build consistency.' },
  3:  { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'},{day:'sun',s:'C'}], note:'First downhill running session this week (see Tuesday). Keep lifting loads moderate — you don\'t need to push both at once.' },
  4:  { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'Dropping to 2x/week as running volume increases. Loads go up — push Session A to a real heavy effort.' },
  5:  { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'Standard build-phase dosage.' },
  6:  { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'2nd downhill running session this week (Tuesday) — can be a bit more aggressive than week 3.' },
  7:  { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'Standard build-phase dosage. This is your longest long run yet (19 mi) — make sure Monday\'s lift isn\'t too close to full fatigue.' },
  8:  { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'Peak week before the half marathon. Drop one set from every exercise — protect the 20-miler and the race next week.' },
  9:  { lifts:[{day:'mon',s:'A'}], note:'Half marathon mini-taper — one light session only, loads ~30% lighter, skip Session B entirely and let the race go clean.' },
  10: { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'3rd downhill running session this week (Tuesday). Back to standard loads after last week\'s reduction.' },
  11: { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'},{day:'sun',s:'C'}], note:'Cutback mileage week — good window to add the 3rd session back and push loads a little.' },
  12: { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'Peak week (20-miler). Drop one set from every exercise again — protect the long run.' },
  13: { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'Final downhill running session this week (Tuesday), ~2.5 weeks out — enough time to fully recover before race day. Start the strength taper: cut sets by about half, drop all plyos, keep loads moderate-heavy.' },
  14: { lifts:[{day:'mon',s:'A'},{day:'thu',s:'B'}], note:'Continue at ~50% volume. Nothing new added this late — just hold what you\'ve built.' },
  15: { lifts:[{day:'mon',s:'A'}], note:'Race week. One short bodyweight activation session Monday only, ~15 min, no soreness risk. Nothing after Tuesday.' },
};

const HILL_NOTE = "Add a downhill running segment to today's run: find a moderate grade (4-6%), run controlled repeats totaling ~15-20 min, short quick steps, avoid overstriding/braking hard. This is timed for the repeated bout effect — a single dose gives your quads weeks of protective adaptation against the NYC bridges and the Fifth Avenue descent into Central Park.";

/* =========================================================
   HELPERS
   ========================================================= */

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

function findWeekForDate(dateISO){
  const d = parseISO(dateISO);
  for(const w of WEEKS){
    const s = parseISO(w.start), e = parseISO(w.end);
    if(d >= s && d <= e) return w;
  }
  return null;
}

function dayKeyForDate(dateISO){
  const d = parseISO(dateISO);
  const idx = d.getDay(); // 0=Sun..6=Sat
  return ['sun','mon','tue','wed','thu','fri','sat'][idx];
}

function daysUntilRace(dateISO){
  const d = parseISO(dateISO), r = parseISO(RACE_DATE);
  return Math.round((r - d) / 86400000);
}

/* =========================================================
   RENDER — PLAN TAB
   ========================================================= */

function renderPlan(){
  const el = document.getElementById('tab-plan');
  let html = '<div class="section-head"><h2>15-Week Plan</h2><p class="sub">7/20 &mdash; 11/1, NYC Marathon</p></div>';
  html += '<div class="week-list">';
  for(const w of WEEKS){
    html += `<div class="week-card">
      <div class="week-card-head">
        <span class="week-num">W${w.n}</span>
        <span class="week-dates">${fmtDateRange(w.start,w.end)}</span>
        <span class="week-phase phase-${w.phase.toLowerCase().replace(' ','-')}">${w.phase}</span>
      </div>
      <div class="day-row">`;
    for(const dk of DAY_KEYS){
      const day = w.days[dk];
      html += `<div class="day-cell type-${day.t}">
        <div class="day-abbr">${dk.toUpperCase()}</div>
        <div class="day-mi">${day.mi > 0 ? day.mi : '&mdash;'}</div>
        <div class="day-label">${day.label}${day.hill ? ' <span class="hill-tag">+hills</span>' : ''}</div>
      </div>`;
    }
    html += `</div>
      <div class="week-total">Total: <strong>${w.total} mi</strong></div>
    </div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

function fmtDateRange(startISO, endISO){
  const s = parseISO(startISO), e = parseISO(endISO);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[s.getMonth()]} ${s.getDate()} &ndash; ${months[e.getMonth()]} ${e.getDate()}`;
}

/* =========================================================
   RENDER — TODAY TAB
   ========================================================= */

function renderToday(){
  const el = document.getElementById('tab-today');
  const todayISO = toISO(new Date());
  const week = findWeekForDate(todayISO);
  const dLeft = daysUntilRace(todayISO);

  let html = '<div class="section-head"><h2>Today</h2>';
  html += `<p class="sub">${dLeft >= 0 ? dLeft + ' days to race day' : 'Race complete \u2014 great work'}</p></div>`;

  if(!week){
    html += '<div class="card"><p>Today falls outside the 15-week plan window.</p></div>';
    el.innerHTML = html;
    return;
  }

  const dk = dayKeyForDate(todayISO);
  const day = week.days[dk];

  html += `<div class="card today-run">
    <div class="card-eyebrow">Week ${week.n} &middot; ${DAY_NAMES[dk]}</div>
    <div class="today-run-main">
      <span class="today-mi">${day.mi > 0 ? day.mi : '\u2014'}</span>
      <span class="today-run-label">${day.label}</span>
    </div>
    ${day.hill ? `<div class="hill-callout">${HILL_NOTE}</div>` : ''}
  </div>`;

  // Weather card
  html += `<div class="card" id="weather-card">
    <div class="card-eyebrow">Weather</div>
    <div id="weather-body"><p class="muted">Loading forecast&hellip;</p></div>
  </div>`;

  // Lift card
  const sched = LIFT_SCHEDULE[week.n];
  const liftToday = sched.lifts.find(l => l.day === dk);
  if(liftToday){
    const session = SESSIONS[liftToday.s];
    html += `<div class="card today-lift">
      <div class="card-eyebrow">Tonight's Lift</div>
      <div class="today-lift-name">${session.name}</div>
      <div class="today-lift-meta">${session.duration}</div>
      <p class="week-note">${sched.note}</p>
      <a class="btn-link" data-goto="strength">View full workout &rarr;</a>
    </div>`;
  } else {
    html += `<div class="card today-lift no-lift">
      <div class="card-eyebrow">Tonight's Lift</div>
      <p class="muted">No lift scheduled today. Rest up.</p>
    </div>`;
  }

  el.innerHTML = html;

  // wire up nav link
  const link = el.querySelector('[data-goto="strength"]');
  if(link) link.addEventListener('click', () => switchTab('strength'));

  loadWeather();
}

const WEATHER_CODES = {
  0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',
  66:'Freezing rain',67:'Freezing rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
  80:'Rain showers',81:'Rain showers',82:'Violent showers',
  85:'Snow showers',86:'Snow showers',
  95:'Thunderstorm',96:'Thunderstorm w/ hail',99:'Thunderstorm w/ hail',
};

function loadWeather(){
  const body = document.getElementById('weather-body');
  const saved = localStorage.getItem('nycmp_location');

  function fetchFor(lat, lon, label){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&temperature_unit=fahrenheit&wind_speed_unit=mph`;
    fetch(url).then(r => r.json()).then(data => {
      const c = data.current;
      const desc = WEATHER_CODES[c.weather_code] || 'Conditions unavailable';
      body.innerHTML = `
        <div class="weather-main">
          <span class="weather-temp">${Math.round(c.temperature_2m)}&deg;F</span>
          <span class="weather-desc">${desc}</span>
        </div>
        <div class="weather-details">
          <span>Wind ${Math.round(c.wind_speed_10m)} mph</span>
          <span>Humidity ${c.relative_humidity_2m}%</span>
        </div>
        <div class="weather-loc">${label} &middot; <button class="link-btn" id="change-loc">change location</button></div>
      `;
      document.getElementById('change-loc').addEventListener('click', promptLocation);
    }).catch(() => {
      body.innerHTML = '<p class="muted">Couldn\'t load the forecast right now.</p>';
    });
  }

  if(saved){
    const loc = JSON.parse(saved);
    fetchFor(loc.lat, loc.lon, loc.label);
  } else if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => {
        const loc = { lat:pos.coords.latitude, lon:pos.coords.longitude, label:'Current location' };
        localStorage.setItem('nycmp_location', JSON.stringify(loc));
        fetchFor(loc.lat, loc.lon, loc.label);
      },
      () => {
        // fallback: Cincinnati, OH
        const loc = { lat:39.1031, lon:-84.5120, label:'Cincinnati, OH' };
        fetchFor(loc.lat, loc.lon, loc.label);
      }
    );
  } else {
    const loc = { lat:39.1031, lon:-84.5120, label:'Cincinnati, OH' };
    fetchFor(loc.lat, loc.lon, loc.label);
  }
}

function promptLocation(){
  const input = prompt('Enter a city (we\'ll geocode it):', '');
  if(!input) return;
  fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(input)}&count=1`)
    .then(r => r.json())
    .then(data => {
      if(data.results && data.results.length){
        const r = data.results[0];
        const loc = { lat:r.latitude, lon:r.longitude, label:`${r.name}, ${r.admin1 || r.country}` };
        localStorage.setItem('nycmp_location', JSON.stringify(loc));
        loadWeather();
      } else {
        alert('Couldn\'t find that location.');
      }
    });
}

/* =========================================================
   RENDER — STRENGTH TAB
   ========================================================= */

function renderExerciseCard(exId){
  const ex = EXERCISES[exId];
  return `<details class="exercise">
    <summary>
      <span class="ex-name">${ex.name}</span>
      <span class="ex-sets">${ex.sets}</span>
    </summary>
    <div class="ex-body">
      <span class="ex-tag">${ex.tag}</span>
      <p><strong>Why it helps the marathon:</strong> ${ex.why}</p>
      <p><strong>How to perform it:</strong> ${ex.how}</p>
    </div>
  </details>`;
}

function renderSessionBlock(sessionKey){
  const s = SESSIONS[sessionKey];
  let html = `<div class="session-block">
    <div class="session-head"><span class="session-name">${s.name}</span><span class="session-dur">${s.duration}</span></div>`;
  for(const exId of s.exercises){
    html += renderExerciseCard(exId);
  }
  html += '</div>';
  return html;
}

function renderStrength(){
  const el = document.getElementById('tab-strength');
  let html = '<div class="section-head"><h2>Strength Plan</h2><p class="sub">Optimized around your running schedule &middot; evenings &middot; hill/quad-durability focus</p></div>';

  html += `<div class="card intro-card">
    <p>NYC isn't flat — the Verrazzano start, the Queensboro Bridge climb around mile 15-16, and the Fifth Avenue climb into Central Park at mile 22-23 (when your legs are already cooked) all come with descents that load your quads and hips hard. This plan runs 2-3 lifts a week and adds targeted eccentric quad and hip-stability work, plus dedicated downhill running sessions timed around the <em>repeated bout effect</em> &mdash; a single downhill exposure gives your quads weeks of protective adaptation, so the sessions are spaced out, not stacked.</p>
  </div>`;

  html += '<div class="week-list">';
  for(const w of WEEKS){
    const sched = LIFT_SCHEDULE[w.n];
    if(!sched) continue;
    html += `<div class="week-card">
      <div class="week-card-head">
        <span class="week-num">W${w.n}</span>
        <span class="week-dates">${fmtDateRange(w.start,w.end)}</span>
        <span class="week-phase phase-${w.phase.toLowerCase().replace(' ','-')}">${w.phase}</span>
      </div>
      <p class="week-note">${sched.note}</p>`;
    for(const lift of sched.lifts){
      html += `<div class="lift-day-label">${DAY_NAMES[lift.day]}</div>`;
      html += renderSessionBlock(lift.s);
    }
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

/* =========================================================
   TAB SWITCHING
   ========================================================= */

function switchTab(name){
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${name}"]`).classList.add('active');
  window.scrollTo(0,0);
}

/* =========================================================
   INIT
   ========================================================= */

function init(){
  renderPlan();
  renderToday();
  renderStrength();

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
}

document.addEventListener('DOMContentLoaded', init);

document.getElementById('countdown').textContent = daysUntilRace(toISO(new Date())) + ' days to race day';
</script>
